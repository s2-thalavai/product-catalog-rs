apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: product-catalog-rs
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - CHANGE_ME.example.com
      secretName: product-catalog-rs-tls
  rules:
    - host: CHANGE_ME.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: product-catalog-rs
                port:
                  name: http
          - path: /openapi
            pathType: Prefix
            backend:
              service:
                name: product-catalog-rs
                port:
                  name: http
