apiVersion: v1
kind: Service
metadata:
  name: product-catalog-rs-postgres
  labels:
    app.kubernetes.io/name: product-catalog-rs-postgres
spec:
  clusterIP: None   # headless: stable DNS for the StatefulSet pod
  selector:
    app.kubernetes.io/name: product-catalog-rs-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
